[package]
name = "hyperhle-gles"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "Standalone OpenGL ES core extracted from HyperHLE (touchHLE fork) for the S5LBox Android port"

[lib]
name = "hyperhle_gles"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
touchHLE_gl_bindings = { path = "gl-bindings" }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
