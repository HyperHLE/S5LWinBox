name: Build S5LWinBox (Windows x64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build HyperHLE GLES Core
        shell: cmd
        run: |
          cd rust\hyperhle-gles
          cargo build --release

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build S5LWinBox
        shell: cmd
        run: |
          cmake --build build --config Release --target s5lwinbox --parallel

      - name: Assemble Release Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          New-Item -ItemType Directory -Path package -Force
          
          $exe = Get-ChildItem -Path build -Filter s5lwinbox.exe -Recurse | Select-Object -First 1
          if ($exe) {
            Write-Host "Found s5lwinbox.exe at $($exe.FullName)"
            Copy-Item $exe.FullName package/ -Force
          } else {
            Write-Error "s5lwinbox.exe not found in build directory!"
            exit 1
          }
          
          $sdl = Get-ChildItem -Path build -Filter SDL2.dll -Recurse | Select-Object -First 1
          if ($sdl) {
            Write-Host "Found SDL2.dll at $($sdl.FullName)"
            Copy-Item $sdl.FullName package/ -Force
          }
          
          $gles = Get-ChildItem -Path rust/hyperhle-gles -Filter hyperhle_gles.dll -Recurse | Select-Object -First 1
          if ($gles) {
            Write-Host "Found hyperhle_gles.dll at $($gles.FullName)"
            Copy-Item $gles.FullName package/ -Force
          }
          
          if (Test-Path tools/angle/libEGL.dll) {
            Write-Host "Found tools/angle/libEGL.dll"
            Copy-Item tools/angle/libEGL.dll package/ -Force
            Copy-Item tools/angle/libGLESv2.dll package/ -Force
          }
          
          Copy-Item README.md package/ -Force -ErrorAction SilentlyContinue
          Copy-Item LICENSE package/ -Force -ErrorAction SilentlyContinue
          
          Compress-Archive -Path package/* -DestinationPath dist/S5LWinBox-windows-x64.zip -Force
          Get-Item dist/S5LWinBox-windows-x64.zip | Format-List FullName, Length

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S5LWinBox-windows-x64
          path: dist/S5LWinBox-windows-x64.zip
          retention-days: 14

      - name: Notify Telegram
        if: always()
        shell: powershell
        env:
          BUILD_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
        run: |
          python tools/notify_telegram.py
